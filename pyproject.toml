[project]
name = "radio-schedules"
version = "0.1.0"
description = "A tool to preprocess various radio schedule lists"
readme = "README.md"
requires-python = ">=3.14"
maintainers = [
  { name = "Max Arnold" },
]
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["shortwave", "radio", "schedule"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.12,<3",
  "textual>=8.2.8,<9",
  "textual-serve>=1.1.3",
]

[project.urls]
Homepage = "https://github.com/esp32-si4732/radio-schedules"
Repository = "https://github.com/esp32-si4732/radio-schedules"
Issues = "https://github.com/esp32-si4732/radio-schedules/issues"

[project.scripts]
rsked = "radio_schedules.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "prek",
  "pytest>=8,<10",
  "ruff",
]

[tool.uv]
exclude-newer = "3 days"

[tool.uv.build-backend]
module-name = "radio_schedules"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
